[project]
name = "evoforge"
version = "0.1.0"
description = "Autonomous AI Software Engineering Platform"
authors = [
    { name = "Ben", email = "ben@example.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "pydantic>=2.7.0",
    "litellm>=1.35.0",
    "PyGithub>=2.3.0",
    "GitPython>=3.1.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "ruff>=0.4.0",
]

[project.scripts]
evoforge = "evoforge.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
